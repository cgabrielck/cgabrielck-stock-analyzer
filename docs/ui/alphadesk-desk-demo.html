<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ALPHA//DESK UI Demo — E8 style</title>
  <style>
    body { margin: 0; background: #071016; color: #9fb3b8; font-family: Segoe UI, Arial, sans-serif; }
    header { padding: 18px 24px; border-bottom: 1px solid #15343c; color: #e8fffb; }
    main { padding: 24px; display: grid; gap: 36px; }
    img { width: 100%; max-width: 1400px; border-radius: 16px; display: block; border: 1px solid #1a4a52; }
    figcaption { margin-top: 10px; font-size: 14px; }
    .accent { color: #2de2c5; }
  </style>
</head>
<body>
  <header><strong>ALPHA//DESK</strong> — Prop / E8 visual language demos</header>
  <main>
    <figure>
      <img src="alphadesk-e8-desk.png" alt="Desk" />
      <figcaption><span class="accent">1. Desk</span> — equity curve, risk gates, holdings, trade ticket, orders</figcaption>
    </figure>
    <figure>
      <img src="alphadesk-e8-aimode.png" alt="AI Mode" />
      <figcaption><span class="accent">2. AI Mode</span> — only place to tune strategy / LLM / worker</figcaption>
    </figure>
    <figure>
      <img src="alphadesk-e8-market.png" alt="Market" />
      <figcaption><span class="accent">3. Market</span> — scan, scores, regime</figcaption>
    </figure>
    <figure>
      <img src="alphadesk-e8-research.png" alt="Research" />
      <figcaption><span class="accent">4. Research</span> — chart, score, plan, news/valuation tabs</figcaption>
    </figure>
    <figure>
      <img src="alphadesk-e8-alerts.png" alt="Alerts" />
      <figcaption><span class="accent">5. Alerts / Calendar</span> — rules + events (calendar is optional add-on)</figcaption>
    </figure>
  </main>
</body>
</html>
