<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cgab</title>
  <style>
    :root {
      --bg:#071016; --card:#0e1c22; --card2:#12242c; --line:#1a3d44;
      --cyan:#2de2c5; --purple:#7c6cff; --mint:#3ee0a0; --rose:#ff6b81;
      --text:#e8fffb; --muted:#8aa8ae; --sidebar:#050b0e; --nav:#0b1820;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; font-family:"Segoe UI",Inter,system-ui,sans-serif; background:radial-gradient(1200px 600px at 80% -10%, #14343a 0%, transparent 50%), var(--bg); color:var(--text); }
    button,input,select,textarea { font:inherit; color:inherit; }
    .shell { display:grid; grid-template-columns:248px 1fr; min-height:100%; }
    .sidebar { background:linear-gradient(180deg,#061014 0%, #050b0e 100%); border-right:1px solid var(--line); padding:16px 12px 14px; display:flex; flex-direction:column; gap:10px; }
    .brand { display:flex; align-items:center; gap:10px; padding:4px 8px 8px; font-weight:800; font-size:20px; letter-spacing:.04em; }
    .mark { width:28px; height:28px; border-radius:9px; background:linear-gradient(135deg,var(--cyan),var(--purple)); box-shadow:0 0 16px rgba(45,226,197,.35); }
    .nav-stack { display:flex; flex-direction:column; gap:12px; }
    .nav-group {
      position:relative; border-radius:18px; padding:10px 8px 8px;
      background:linear-gradient(180deg, rgba(18,36,44,.9), rgba(8,18,22,.75));
      border:1px solid rgba(45,226,197,.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }
    .nav-group::before {
      content:""; position:absolute; left:0; top:12px; bottom:12px; width:3px; border-radius:99px;
    }
    .nav-group.g-nav::before { background:linear-gradient(180deg,var(--cyan),#1a8f80); }
    .nav-group.g-apps { border-color:rgba(124,108,255,.28); }
    .nav-group.g-apps::before { background:linear-gradient(180deg,var(--purple),#4b3fd1); }
    .nav-group.g-more { border-color:rgba(138,168,174,.22); }
    .nav-group.g-more::before { background:linear-gradient(180deg,#8aa8ae,#4d6469); }
    .nav-head { display:flex; align-items:center; gap:10px; padding:4px 8px 8px 10px; }
    .nav-ico {
      width:28px; height:28px; border-radius:9px; display:grid; place-items:center;
      font-size:13px; font-weight:800; color:#052226;
    }
    .g-nav .nav-ico { background:var(--cyan); }
    .g-apps .nav-ico { background:var(--purple); color:#fff; }
    .g-more .nav-ico { background:#2a3d44; color:var(--text); }
    .nav-k { font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
    .nav-sub { font-size:11px; color:#c5e8e2; margin-top:1px; font-weight:600; }
    .nav-btn { width:100%; text-align:left; background:transparent; border:0; color:var(--muted); padding:9px 12px 9px 14px; border-radius:11px; cursor:pointer; display:flex; align-items:center; gap:8px; }
    .nav-btn .dot { width:5px; height:5px; border-radius:50%; background:#35555c; }
    .nav-btn.on .dot { background:var(--cyan); box-shadow:0 0 8px var(--cyan); }
    .nav-btn.on, .nav-btn:hover { background:rgba(45,226,197,.08); color:var(--cyan); }
    .g-apps .nav-btn.on, .g-apps .nav-btn:hover { background:rgba(124,108,255,.12); color:#cfc8ff; }
    .g-apps .nav-btn.on .dot { background:var(--purple); box-shadow:0 0 8px var(--purple); }
    .foot { margin-top:auto; padding:8px 6px 2px; display:flex; flex-direction:column; gap:8px; }
    .pill { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--cyan); color:var(--cyan); border-radius:999px; padding:6px 12px; font-size:11px; font-weight:800; letter-spacing:.08em; width:fit-content; }
    .pill.off { border-color:#35555c; color:var(--muted); }
    .pill.warn { border-color:#e7c36a; color:#e7c36a; }
    .topbar { display:flex; gap:10px; align-items:center; padding:14px 22px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
    .search { flex:1; min-width:180px; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:10px 16px; }
    .chip { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:8px 12px; font-size:13px; color:var(--muted); }
    .lang { display:flex; background:#0b1820; border:1px solid var(--line); border-radius:999px; padding:3px; }
    .lang button { border:0; background:transparent; color:var(--muted); border-radius:999px; padding:6px 12px; cursor:pointer; font-weight:700; font-size:12px; }
    .lang button.on { background:var(--cyan); color:#052226; }
    .content { padding:20px 22px 32px; }
    .kpis { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:12px; margin-bottom:16px; }
    .card { background:linear-gradient(180deg,var(--card2),var(--card)); border:1px solid var(--line); border-radius:16px; padding:16px; }
    .card h3 { margin:0 0 10px; font-size:15px; }
    .lbl { color:var(--muted); font-size:12px; } .val { font-size:20px; font-weight:700; margin-top:6px; }
    .pos { color:var(--mint); } .neg { color:var(--rose); } .muted { color:var(--muted); font-size:13px; } .err { color:var(--rose); }
    .ok { color:var(--mint); }
    .layout { display:grid; grid-template-columns:1.7fr .9fr; gap:14px; }
    .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:14px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { text-align:left; color:var(--muted); font-weight:500; padding:8px 6px; border-bottom:1px solid var(--line); }
    td { padding:10px 6px; border-bottom:1px solid #132830; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .btn { background:var(--cyan); color:#052226; border:0; border-radius:999px; padding:9px 14px; font-weight:700; cursor:pointer; }
    .ghost { background:transparent; color:var(--cyan); border:1px solid var(--cyan); }
    .danger { background:var(--rose); color:#1a0508; }
    .purple { background:var(--purple); color:#fff; }
    .field { display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--muted); }
    input,select,textarea { background:#07141a; border:1px solid var(--line); border-radius:12px; padding:9px 10px; }
    .tab { background:#0d1f26; border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:7px 12px; cursor:pointer; }
    .tab.on { color:#052226; background:var(--cyan); border-color:var(--cyan); }
    .bars { display:flex; align-items:flex-end; gap:2px; height:140px; }
    .bar { flex:1; background:linear-gradient(180deg,var(--cyan),var(--purple)); border-radius:3px 3px 0 0; min-height:4px; }
    .banner {
      display:flex; gap:14px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap;
      margin-bottom:16px; padding:14px 16px; border-radius:16px;
      border:1px solid rgba(45,226,197,.35); background:rgba(45,226,197,.08);
    }
    .banner.off { border-color:rgba(231,195,106,.35); background:rgba(231,195,106,.08); }
    .banner.warn { border-color:rgba(231,195,106,.6); }
    .banner h2 { margin:0 0 6px; font-size:16px; }
    .status-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; background:var(--muted); }
    .status-dot.on { background:var(--mint); box-shadow:0 0 8px var(--mint); }
    .guide-step { border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; background:#0b1820; }
    .guide-step b { color:var(--cyan); }
    .tour-mask {
      position:fixed; inset:0; background:rgba(2,8,10,.72); z-index:40;
      display:flex; align-items:center; justify-content:center; padding:24px;
      backdrop-filter:blur(6px);
    }
    .tour-card {
      width:min(520px,100%); background:linear-gradient(180deg,#12242c,#0b1820);
      border:1px solid rgba(45,226,197,.35); border-radius:20px; padding:22px;
      box-shadow:0 24px 80px rgba(0,0,0,.45);
    }
    .tour-card h2 { margin:8px 0 10px; }
    .hidden { display:none; }
    .icon-btn { width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--cyan); cursor:pointer; font-weight:800; }
    .prog { margin-top:12px; }
    .prog-top { display:flex; justify-content:space-between; align-items:baseline; gap:12px; font-size:13px; }
    .prog-pct { font-weight:800; color:var(--cyan); font-size:20px; letter-spacing:.02em; }
    .prog-track { height:10px; border-radius:99px; background:#07141a; border:1px solid var(--line); overflow:hidden; margin-top:8px; }
    .prog-fill { height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,var(--cyan),var(--purple)); transition:width .4s ease; }
    .pick-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; }
    .pick-card { background:#0b1820; border:1px solid var(--line); border-radius:16px; padding:14px; cursor:pointer; min-width:0; }
    .pick-card:hover { border-color:var(--cyan); }
    .pick-rank { font-size:10px; letter-spacing:.16em; color:var(--muted); }
    .pick-ticker { font-size:22px; font-weight:800; margin:4px 0 2px; }
    .pick-name { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .meter { height:6px; border-radius:99px; background:#07141a; overflow:hidden; margin-top:8px; }
    .meter > span { display:block; height:100%; background:linear-gradient(90deg,var(--cyan),var(--purple)); }
    .badge { display:inline-block; font-size:10px; font-weight:800; letter-spacing:.08em; border-radius:999px; padding:3px 8px; }
    .badge.buy { background:rgba(62,224,160,.15); color:var(--mint); }
    .badge.hold { background:rgba(231,195,106,.12); color:#e7c36a; }
    .badge.watch { background:rgba(138,168,174,.12); color:var(--muted); }
    .badge.avoid { background:rgba(255,107,129,.15); color:var(--rose); }
    .ticket { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:12px 0; }
    .ticket div { background:#07141a; border:1px solid var(--line); border-radius:12px; padding:10px; }
    .news-line { font-size:12px; color:var(--muted); margin:6px 0; padding-left:8px; border-left:2px solid var(--line); }
    .news-line.positive { border-color:var(--mint); }
    .news-line.negative { border-color:var(--rose); }
    .why { font-size:13px; line-height:1.45; color:#cfe8e3; margin:10px 0 0; }
    .tape { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .pick-card.sel { border-color:var(--cyan); box-shadow:0 0 0 1px rgba(45,226,197,.35); }
    .blotter { margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
    .stat-grid { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:8px; margin-top:10px; }
    .stat { background:#07141a; border:1px solid var(--line); border-radius:12px; padding:10px; }
    .stat .val { font-size:16px; }
    .score-row { display:grid; grid-template-columns:88px 1fr 40px; gap:8px; align-items:center; margin:6px 0; font-size:12px; color:var(--muted); }
    .heat { font-variant-numeric:tabular-nums; font-weight:700; }
    .heat.buy { color:var(--mint); }
    .heat.hold { color:#e7c36a; }
    .heat.watch { color:var(--muted); }
    .heat.avoid { color:var(--rose); }
    .phase { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--cyan); }
    @media(max-width:1100px){ .kpis,.layout,.grid3,.grid2,.pick-grid,.ticket,.stat-grid{grid-template-columns:1fr;} .shell{grid-template-columns:1fr;} .sidebar{display:none;} }
  </style>
</head>

        <button class="nav-btn" data-page="settings"><span class="dot"></span><span data-i18n="page.settings">Settings</span></button>
      </section>
    </div>
    <div class="foot">
      <span class="pill" id="paperPill">PAPER</span>
      <div class="muted" data-i18n="brand.tag">US equity AI desk</div>
    </div>
  </aside>
  <section>
    <header class="topbar">
      <input id="search" class="search" data-i18n-placeholder="search.ph" placeholder="Search symbol…" />
      <span class="pill" id="chipPaper">PAPER</span>
      <span class="pill off" id="chipAuto">AUTO OFF</span>

      </div>
      <button class="icon-btn" id="helpBtn" title="Guide">?</button>
      <button class="btn ghost" id="refresh" data-i18n="btn.refresh">Refresh</button>
    </header>
    <div class="content" id="root"><p class="muted">Loading Cgab…</p></div>
  </section>
</div>

function autoBanner(){
  const on = !!(worker && worker.running);
  const research = worker?.research || {};
  const scanStale = !!(worker?.scan_stale || research.scan_stale);
  const researchMsg = lang === "zh-TW"
    ? (research.message_zh || "")
    : (research.message_en || "");
  const nextScan = worker?.next_scan_at || research.next_scan_at;
  const nextLine = (worker?.scan_auto || research.scan_auto) && nextScan
    ? `<p class="muted" style="margin:8px 0 0">${t("desk.scan.next",{t: String(nextScan).replace("T"," ").slice(0,16)})}</p>`
    : "";
  const asOf = worker?.scan_as_of || research.scan_as_of || worker?.scan_ts || research.scan_ts;
  const asOfLine = asOf
    ? `<p class="muted" style="margin:8px 0 0">as-of ${String(asOf).replace("T"," ").slice(0,19)}</p>`
    : "";
  const staleLine = scanStale
    ? `<p class="muted" style="margin:8px 0 0;color:#e8b86d">${t("desk.scan.stale")}</p>`
    : (researchMsg ? `<p class="muted" style="margin:8px 0 0">${researchMsg}</p>` : "");
  const skips = worker?.skip_counts || {};

  const skipLine = skipKeys.length
    ? `<p class="muted" style="margin:8px 0 0">${t("aimode.why")}: ${skipKeys.map(k=>`${k}×${skips[k]}`).join(" · ")}</p>`
    : "";
  return `<div class="banner ${on?"":"off"} ${scanStale?"warn":""}">
    <div>
      <h2><span class="status-dot ${on?"on":""}"></span>${on?t("desk.banner.on"):t("desk.banner.off")}</h2>
      <p class="muted" style="margin:0">${explainMsg() || t("desk.how")}</p>

function esc(s){

}
function num(n, d=1){
  if(n && typeof n === "object" && n.price != null) n = n.price;
  if(n==null || n==="" || isNaN(Number(n))) return "—";
  return Number(n).toFixed(d);
}
function fmtTs(ts){
  if(!ts) return "—";
  try { return new Date(ts).toLocaleString(lang==="zh-TW"?"zh-Hant-TW":"en-US"); }
  catch { return String(ts).slice(0,19); }
}
function jobPct(job){
  if(!job) return 0;
  if(job.pct != null) return Math.max(0, Math.min(100, Number(job.pct)));
  const tot = Number(job.total)||74;
  return Math.max(0, Math.min(100, Math.round(100*(Number(job.progress)||0)/tot)));
}
function fmtEta(sec){
  if(sec==null || sec==="" || isNaN(sec)) return "";
  const n=Math.max(0, Number(sec));
  const m=Math.floor(n/60), s=Math.floor(n%60);
  return t("scan.eta",{m, s});
}
function conviction(score){
  const n=Number(score);
  if(isNaN(n)) return {key:"scan.conviction.watch", cls:"watch"};
  if(n>=80) return {key:"scan.conviction.strong", cls:"buy"};
  if(n>=70) return {key:"scan.conviction.buy", cls:"buy"};
  if(n>=60) return {key:"scan.conviction.hold", cls:"hold"};
  return {key:"scan.conviction.watch", cls:"watch"};
}
function meter(n){ const w=Math.max(0,Math.min(100,Number(n)||0)); return `<div class="meter"><span style="width:${w}%"></span></div>`; }
function hydrate(row){
  if(!row) return {};
  const u = universeByTicker[row.ticker] || {};
  return {
    ...row,
    name: row.name_en || u.name_en || row.name,
    name_zh: row.name_zh || u.name_tw || u.name_cn || row.name
  };
}
function pickLabel(p){

function progressPanel(job, prefix){
  const running = job && (job.status==="queued"||job.status==="running");
  const show = running || (job && job.status==="error");
  if(!show) return "";
  const pct = running ? jobPct(job) : 0;
  return `<div class="prog" id="${prefix}Prog">
    <div class="prog-top">
      <span><span class="phase" id="${prefix}Phase">${esc(phaseLabel(job))}</span> · <span class="prog-pct" id="${prefix}Pct">${pct}%</span></span>
      <span class="muted" id="${prefix}Eta">${running?fmtEta(job.eta_sec):""}</span>
    </div>
    <div class="prog-track"><div class="prog-fill" id="${prefix}Fill" style="width:${pct}%"></div></div>
    <p class="muted" id="${prefix}Msg">${esc(job && job.message ? job.message : t("scan.wait"))}</p>
  </div>`;
}
function applyProgress(prefix, job){
  const pctEl=$(`#${prefix}Pct`), fill=$(`#${prefix}Fill`), msg=$(`#${prefix}Msg`), eta=$(`#${prefix}Eta`), phase=$(`#${prefix}Phase`);
  if(!pctEl || !job) return;
  const pct=jobPct(job);
  pctEl.textContent = pct+"%";
  if(fill) fill.style.width=pct+"%";
  if(msg) msg.textContent = job.message || t("scan.running",{n:job.progress||0,t:job.total||74});
  if(eta) eta.textContent = (job.status==="running"||job.status==="queued") ? fmtEta(job.eta_sec) : "";
  if(phase) phase.textContent = phaseLabel(job);
}
async function pollJob(kind, jobId, onTick){
  const path = kind === "scan" ? `/api/scan/status?job_id=${encodeURIComponent(jobId)}` : `/api/deep/status?job_id=${encodeURIComponent(jobId)}`;
  const latestPath = kind === "scan" ? "/api/scan/latest" : "/api/deep/latest";
  let last = {};
  for(let i=0;i<900;i++){
    try {
      const st = await api(path);
      last = st.job || {};
      if(onTick) onTick(last);
      if(last.status === "done" || last.status === "error") return last;
    } catch(e) {
      if(i >= 3){
        try {
          const latest = await api(latestPath);
          if(latest && (latest.job_id===jobId || latest.available)){
            return {status:"done", result: latest, message:"Complete"};
          }
        } catch(_){}
      }
    }
    await new Promise(r=>setTimeout(r, 1000));
  }
  try {
    const latest = await api(latestPath);
    if(latest && ((latest.rankings||[]).length || (latest.recommendations||[]).length || latest.reports)){
      return {status:"done", result: latest, message:"Complete"};
    }
  } catch(_){}
  return last.status ? last : {status:"error", message:"timeout"};
}
function resultHasRows(data){
  if(!data) return false;
  return ((data.rankings||[]).length + (data.recommendations||[]).length) > 0;
}
function mergeScan(latest, job){
  if(job && job.result && resultHasRows(job.result)){
    return {available:true, stale:false, ...job.result};
  }
  return latest || {};
}
function scoreCell(n){
  const conv = conviction(n);
  return `<span class="heat ${conv.cls}">${num(n)}</span>`;
}
function scoreStack(p){
  const rows = [
    ["Growth", p.growth_score],
    ["Tech", p.technical_score || p.timing_score],
    ["Sent", p.sentiment_score],
    ["LLM", p.llm_score]
  ];
  return rows.map(([lab,v])=>`<div class="score-row"><span>${lab}</span>${meter(v)}<span>${num(v)}</span></div>`).join("");
}
function newsTape(items){
  return (items||[]).slice(0,3).map(n=>{
    const title = n && (n.title||n.headline) ? n.title||n.headline : "";
    return `<div class="news-line ${esc(n.sentiment||"")}">${esc(title)}</div>`;
  }).join("");
}

async function scanPage(){
  let latest = {};
  let job = null;
  try {
    const uni = await api("/api/universe");
    universeByTicker = Object.fromEntries((uni.universe||[]).map(s=>[s.ticker,s]));
  } catch{}
  try { latest = await api("/api/scan/latest"); } catch{}
  try { const st = await api("/api/scan/status"); job = st.job; } catch{}
  const paint = () => { root.innerHTML = renderScanBody(latest, job); bind(); };
  const bind = () => {
    root.querySelectorAll(".pick-card, .rank-row").forEach(b=>b.onclick=()=>{ scanFocus=b.dataset.s; symbol=scanFocus; paint(); });
    const deep5 = $("#deep5");
    if(deep5) deep5.onclick=()=>{
      const data = mergeScan(latest, job);
      deepSelected = (data.top5_tickers||(data.recommendations||[]).map(p=>p.ticker)).slice(0,5);
      navTo("research");
    };
    const fd = $("#focusDeep");
    if(fd) fd.onclick=()=>{ if(scanFocus){ symbol=scanFocus; deepSelected=[scanFocus]; navTo("research"); } };
    const fc = $("#focusChart");
    if(fc) fc.onclick=()=>{ if(scanFocus){ symbol=scanFocus; navTo("chart"); } };
    const btn = $("#runScan");
    if(btn) btn.onclick = async () => {
      try {
        const res = await api("/api/scan",{method:"POST",body:JSON.stringify({lang, llm_weight:0.2, use_llm:true})});
        job = res.job;
        paint();
        job = await pollJob("scan", job.id, (j)=>{ if(page!=="scan") return; applyProgress("scan", j); });
        if(page!=="scan") return;
        try { latest = await api("/api/scan/latest"); } catch{}
        latest = mergeScan(latest, job);
        if(job.status==="error" && !resultHasRows(latest)){
          alert(job.error||job.message||"Scan failed");
        }
        job = job.status==="done" ? null : job;
        paint();
        await loadWorker();
      } catch(e){ alert(e.message); const b=$("#runScan"); if(b) b.disabled=false; }
    };
  };
  paint();
  if(job && (job.status==="queued"||job.status==="running")){
    pollJob("scan", job.id, (j)=>{ if(page!=="scan") return; applyProgress("scan", j); }).then(async (done)=>{
      if(page!=="scan") return;
      job = done;
      try { latest = await api("/api/scan/latest"); } catch{}
      latest = mergeScan(latest, job);
      job = job.status==="done" ? null : job;
      paint();
      await loadWorker();
    });
  }
}

          </div>
          <div class="tape">

          </div>

async function research(){
  let universe=[], deep={}, job=null;
  try { universe = (await api("/api/universe")).universe||[]; } catch{}
  try { deep = await api("/api/deep/latest"); } catch{}
  try { const st = await api("/api/deep/status"); job = st.job; } catch{}
  if(job && job.result && job.result.reports){
    deep = {available:true, reports:{...(deep.reports||{}), ...job.result.reports}, latest_batch: job.result.tickers || deep.latest_batch};
  }
  if(!deepSelected.length && symbol) deepSelected=[symbol];
  const paint = () => { root.innerHTML = renderResearchBody(universe, deep, job); bind(); };
  const bind = () => {
    const refreshSel = ()=>{ const el=$("#selList"); if(el) el.textContent = deepSelected.join(", ")||"—"; };
    const addBtn = $("#addBtn");
    if(addBtn) addBtn.onclick=()=>{
      const v = $("#addSym").value;
      if(v && !deepSelected.includes(v) && deepSelected.length<5){ deepSelected.push(v); symbol=v; }
      refreshSel();
    };
    root.querySelectorAll(".open").forEach(b=>b.onclick=()=>{symbol=b.dataset.s; navTo("chart");});
    const run = $("#runDeep");
    if(run) run.onclick=async()=>{
      if(!deepSelected.length){ alert("Select tickers"); return; }
      try{
        const res = await api("/api/deep",{method:"POST",body:JSON.stringify({tickers:deepSelected, lang})});
        job = res.job;
        paint();
        job = await pollJob("deep", job.id, (j)=>{ if(page!=="research") return; applyProgress("deep", j); });
        if(page!=="research") return;
        try { deep = await api("/api/deep/latest"); } catch{}
        if(job.result && job.result.reports){
          deep = {available:true, reports:{...(deep.reports||{}), ...job.result.reports}, latest_batch: job.result.tickers || deep.latest_batch};
        }
        if(job.status==="error" && !(deep.reports && Object.keys(deep.reports).length)){
          alert(job.error||job.message||"Deep failed");
        }
        job = job.status==="done" ? null : job;
        paint();
      }catch(e){ alert(e.message); }
    };
  };
  paint();
  if(job && (job.status==="queued"||job.status==="running")){
    pollJob("deep", job.id, (j)=>{ if(page!=="research") return; applyProgress("deep", j); }).then(async (done)=>{
      if(page!=="research") return;
      job = done;
      try { deep = await api("/api/deep/latest"); } catch{}
      if(job.result && job.result.reports){
        deep = {available:true, reports:{...(deep.reports||{}), ...job.result.reports}, latest_batch: job.result.tickers || deep.latest_batch};
      }
      job = job.status==="done" ? null : job;
      paint();
    });
  }
}

        <p>AUTO ${worker?.running?"ON":"OFF"} · PAPER ${worker?.paper!==false?"YES":"NO"}</p>
        <p class="muted">${explainMsg()}</p>
        <p class="muted">${t("aimode.cap")}: ${worker?.fetched??"—"} / cap ${worker?.universe_cap??"—"} / ${worker?.universe_size??"—"}</p>
        <p class="muted">market hours: ${worker?.market_hours?"yes":"no"} · ignore hours: ${worker?.ignore_market_hours?"yes":"no"}</p>
        <p class="muted">last run: ${worker?.last_run||"—"}</p>
        ${(() => { const sk=worker?.skip_counts||{}; const ks=Object.keys(sk).filter(k=>sk[k]>0).sort((a,b)=>sk[b]-sk[a]); return ks.length?`<p class="muted">${t("aimode.why")}: ${ks.map(k=>`${k}×${sk[k]}`).join(" · ")}</p>`:""; })()}
      </div>
      <div class="card"><h3>${t("aimode.gates")}</h3>
        <p>Kill switch: ${cfg.kill_switch?"ON":"OFF"}</p>
        <p class="muted">${t("aimode.paperonly")}</p>
        <h3 style="margin-top:12px">Signals</h3>
        ${sigs.length?sigs.map(s=>`<p class="muted">${JSON.stringify(s)}</p>`).join(""):`<p class="muted">${t("desk.none")}</p>`}
      </div>
    </div></div>`;
  bindBanner();
  $("#rt").value = cfg.risk_tolerance||"medium";
  let strategy=cfg.strategy;
  root.querySelectorAll("#strats .tab").forEach(b=>b.onclick=()=>{strategy=b.dataset.s; root.querySelectorAll("#strats .tab").forEach(x=>x.classList.toggle("on",x===b));});
  $("#llm").oninput=()=>$("#llmv").textContent=$("#llm").value+"%";
  $("#save").onclick=async()=>{
    await api("/api/ai-mode",{method:"PUT",body:JSON.stringify({strategy,llm_influence:Number($("#llm").value),entry_threshold:Number($("#th").value),max_positions:Number($("#mp").value),risk_tolerance:$("#rt").value,worker_enabled:!!worker?.running,ignore_market_hours:!!worker?.ignore_market_hours})});
    $("#sm").textContent = lang==="zh-TW" ? "已儲存（尚未啟動機器人）。" : "Saved (does not start the worker).";
  };
  const st=$("#wstart"), sp=$("#wstop");
  if(st) st.onclick=async()=>{ try{ worker=await api("/api/worker/start",{method:"POST",body:JSON.stringify({strategy,interval:60})}); applyChrome(); aimode(); }catch(e){ $("#sm").textContent=e.message; } };
  if(sp) sp.onclick=async()=>{ try{ worker=await api("/api/worker/stop",{method:"POST",body:"{}"}); applyChrome(); aimode(); }catch(e){ $("#sm").textContent=e.message; } };
}

async function strategies(){
  const p = await api("/api/performance");
  root.innerHTML = `<div class="card"><h3>${t("page.strategies")}</h3><p class="muted">Stable strategy backtest snapshot</p>
    <div class="grid3"><div class="card"><div class="lbl">Return</div><div class="val">${p.total_return_pct??"—"}%</div></div>
    <div class="card"><div class="lbl">Sharpe</div><div class="val">${p.sharpe_ratio??"—"}</div></div>
    <div class="card"><div class="lbl">Trades</div><div class="val">${p.num_trades??"—"}</div></div></div></div>`;
}

async function calendar(){
  const d = await api("/api/calendar");
  root.innerHTML = `<div class="card"><h3>${t("page.calendar")}</h3><table><thead><tr><th>Date</th><th>Event</th><th>Impact</th><th>Symbol</th></tr></thead>
    <tbody>${(d.events||[]).map(e=>`<tr><td>${e.date}</td><td>${e.event}</td><td>${e.impact}</td><td>${e.symbol||""}</td></tr>`).join("")}</tbody></table></div>`;
}

async function guide(){
  let steps=[];
  try { steps = (await api("/api/guide")).steps||[]; } catch{}
  const pick = (s) => lang==="zh-TW" ? (s.zh||s.en) : (s.en||s.zh);
  root.innerHTML = `<div class="card"><h3>${t("guide.title")}</h3>
    <p class="muted">${t("guide.lead")}</p>
    <button class="btn" id="replay">${t("btn.tour")}</button>
    <div style="margin-top:16px">${steps.map((s,i)=>{ const x=pick(s); return `<div class="guide-step"><b>${i+1}. ${x.title}</b><p class="muted" style="margin:8px 0 0">${x.body}</p></div>`; }).join("")}</div>
  </div>`;
  $("#replay").onclick=()=>{ tourStep=0; showTour(); };
}

async function journal(){
  const d = await api("/api/journal");
  const rows = [...(d.entries||[])].reverse().slice(0,40);
  root.innerHTML = `<div class="card"><h3>${t("page.journal")}</h3>
    <div class="row"><input id="js" value="AAPL" style="width:90px" /><input id="jn" placeholder="Note" style="flex:1" /><button class="btn" id="ja">Add</button></div>
    <table><thead><tr><th>Time</th><th>Symbol</th><th>Note</th></tr></thead>
    <tbody>${rows.map(e=>`<tr><td>${String(e.ts||"").slice(0,19)}</td><td>${e.symbol||""}</td><td>${e.note||JSON.stringify(e)}</td></tr>`).join("")}</tbody></table></div>`;
  $("#ja").onclick=async()=>{ await api("/api/journal",{method:"POST",body:JSON.stringify({symbol:$("#js").value,note:$("#jn").value})}); journal(); };
}

async function options(){
  const d = await api("/api/options/"+symbol);
  const tbl = (rows)=> (rows||[]).map(c=>`<tr><td>${c.strike}</td><td>${c.lastPrice}</td><td>${c.impliedVolatility?.toFixed?.(2)??""}</td></tr>`).join("");
  root.innerHTML = `<div class="card"><h3>${t("page.options")} ${symbol}</h3><p class="muted">Expiry ${d.expiry||"—"}</p>
    <div class="grid2"><div><h3>Calls</h3><table><thead><tr><th>Strike</th><th>Last</th><th>IV</th></tr></thead><tbody>${tbl(d.calls)}</tbody></table></div>
    <div><h3>Puts</h3><table><thead><tr><th>Strike</th><th>Last</th><th>IV</th></tr></thead><tbody>${tbl(d.puts)}</tbody></table></div></div></div>`;
}

async function settings(){
  const m = await api("/api/meta");
  const o = await api("/api/ops");
  await loadWorker();
  root.innerHTML = `<div class="card"><h3>${t("page.settings")}</h3>
    <p>App: <strong>Cgab</strong></p>
    <p>${t("settings.lang")}: ${lang==="zh-TW"?"繁體中文":"English"}</p>
    <p>Paper: ${m.paper}</p>
    <p>Ignore market hours: ${m.ignore_market_hours}</p>
    <p>LLM: ${m.llm?.configured?"ON":"OFF"} · chat=${m.llm?.chat_model||"—"} · reasoner=${m.llm?.reasoning_model||"—"}</p>
    <p class="muted">Scan / Deep use the chat model for batch scores and the reasoner for deep strategy write-ups. The paper worker does not call the LLM every minute.</p>
    <p>AUTO: ${worker?.running?"ON":"OFF"} (${explainMsg()})</p>
    <p class="muted">Kill switch ${o.kill_switch?"ON":"OFF"}</p>
    <p class="muted">docs/CGAB_USER_GUIDE.md</p>
    <button class="btn" id="replay">${t("btn.tour")}</button>
  </div>`;
  $("#replay").onclick=()=>{ tourStep=0; showTour(); };
}

applyChrome();
Promise.all([loadAccount(), loadWorker()]).then(()=>{
  render();
  if(!localStorage.getItem("cgab.tour.done")) { tourStep=0; showTour(); }
});
setInterval(()=>{ loadWorker(); }, 12000);
</script>
</body>
</html>
